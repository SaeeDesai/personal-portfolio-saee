<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>PortfolioPulse | Sign In</title>
    <link rel="stylesheet" href="/dashboard-assets/style.css">
</head>
<body class="login-page">

    <main class="login-card">
        <div class="brand-icon">P</div>

        <h1>PortfolioPulse</h1>
        <p class="subtitle">Your private analytics workspace.</p>

        <form id="login-form">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="login-button" type="submit">
                Sign in
            </button>

            <p id="login-status" role="alert"></p>
        </form>

        <div class="login-footer">
            Private access · Authorized administrator only
        </div>
    </main>

    <script src="/dashboard-assets/login.js" defer></script>
</body>
</html>
