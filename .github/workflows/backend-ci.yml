name: PortfolioPulse Backend CI

on:
  push:
    branches:
      - feature/portfoliopulse-analytics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: portfoliopulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://ci_user:ci_test_password@localhost:5432/portfoliopulse_test
      TEST_DATABASE_URL: postgresql+psycopg://ci_user:ci_test_password@localhost:5432/portfoliopulse_test
      DASHBOARD_ORIGIN: http://localhost:8001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Validate frontend JavaScript
        run: |
          node --check analytics.js
          node --check script.js